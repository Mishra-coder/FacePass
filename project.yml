name: FacePass
options:
  bundleIdPrefix: com.devendramishra
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  FacePass:
    type: application
    platform: macOS
    sources:
      - path: FacePass
    info:
      path: FacePass/Info.plist
      properties:
        CFBundleDisplayName: FacePass
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSCameraUsageDescription: FacePass uses the built-in camera to recognise your face. Frames are processed in memory on this Mac and are never saved or sent anywhere.
        NSHumanReadableCopyright: © 2026 Devendra Mishra
    entitlements:
      path: FacePass/FacePass.entitlements
      properties:
        com.apple.security.device.camera: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.devendramishra.facepass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devendramishra.facepass
        PRODUCT_NAME: FacePass
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 8QSYUNVMA5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
